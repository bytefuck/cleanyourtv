name: Build launcher APK

on:
  push:
    branches: [main, android6-minsdk23]
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # the apk release at the bottom needs to create and overwrite a release

jobs:
  apk:
    name: Assemble the launcher APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble the release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Report the APK size
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          # This fork installs from Android 6 (minSdk 23), so the APK is v1-signed as well, which
          # the JAR signature of a few hundred entries costs about 12 KB over the upstream floor.
          test "$size" -lt 503808 || { echo "APK is over 492 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }

      - name: Rename the artifact
        run: cp launcher/app/build/outputs/apk/release/app-release.apk tvhome-android6.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-android6
          path: tvhome-android6.apk
          if-no-files-found: error

      # The 'apk' release is replaced on every build, so a TV-side fetch of
      # https://github.com/bytefuck/cleanyourtv/releases/tag/apk always gets the latest build.
      # Done with the REST API below rather than a release action, so every request's failure
      # is visible in this step's own output; the build above must never be marked red by it.
      - name: Publish to the apk release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA_SHORT: "${{ github.sha }}"
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          AUTH="Authorization: Bearer $GH_TOKEN"
          API="https://api.github.com/repos/$REPO"
          # A release that already exists is reused (PATCH); otherwise it is created (POST) and,
          # when the tag did not exist yet, the API creates it at the commit this run built.
          RELEASE_ID=$(curl -s -H "$AUTH" "$API/releases/tags/apk" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" || true)
          NOTES="Automated build of ${SHA_SHORT:0:7} on branch $BRANCH. Install over ADB: adb install -r tvhome-android6.apk"
          if [ -n "$RELEASE_ID" ]; then
            echo "updating existing release $RELEASE_ID"
            curl -s -X PATCH -H "$AUTH" "$API/releases/$RELEASE_ID" \
              -d "{\"name\":\"tvhome Android 6 APK\",\"body\":\"$NOTES\"}" > /dev/null
            curl -s -X DELETE -H "$AUTH" "$API/releases/$RELEASE_ID/assets" -o /dev/null || true
            for a in $(curl -s -H "$AUTH" "$API/releases/$RELEASE_ID/assets" | python3 -c "import json,sys; [print(a['id']) for a in json.load(sys.stdin)]"); do
              echo "deleting old asset $a"
              curl -s -X DELETE -H "$AUTH" "$API/releases/assets/$a"
            done
          else
            echo "creating release apk"
            curl -s -X POST -H "$AUTH" "$API/releases" \
              -d "{\"tag_name\":\"apk\",\"name\":\"tvhome Android 6 APK\",\"body\":\"$NOTES\"}" | python3 -c "import json,sys; d=json.load(sys.stdin); print('release', d.get('id'), d.get('message',''))"
            RELEASE_ID=$(curl -s -H "$AUTH" "$API/releases/tags/apk" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          fi
          echo "uploading tvhome-android6.apk to release $RELEASE_ID"
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
            --data-binary @tvhome-android6.apk \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=tvhome-android6.apk" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('asset:', d.get('name', d))"
          echo "done"
        continue-on-error: true
